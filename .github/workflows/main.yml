
name: Generate Purple Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: FernandaLimatech
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D8B4FE&color_dots=%23FFFFFF,%23E9D5FF,%23C084FC,%239333EA,%236B21A8

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
