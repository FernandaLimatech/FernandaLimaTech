
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate purple snake
        uses: Platane/snk@v3
        with:
          github_user_name: FernandaLimaTech
            outputs: |
  dist/github-contribution-grid-snake.svg?color_snake=%23F0A5FF&color_dots=%23160B2B,%234B286B,%237B4BA5,%23B983FF,%23E6CCFF
      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
